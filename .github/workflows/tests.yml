name: Tests

on:
  pull_request:
    branches: [ main, dev, staging, edition-atlanta ]
  push:
    branches: [ main, dev, staging, edition-atlanta ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: '8.4'
        extensions: mbstring, dom, fileinfo, sqlite3
        coverage: pcov

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Check code style (Pint)
      run: ./vendor/bin/pint --test

    - name: Static analysis (PHPStan)
      run: ./vendor/bin/phpstan analyse --no-progress

    - name: Rector compliance (dry-run)
      run: ./vendor/bin/rector --dry-run --no-progress-bar

    - name: Execute tests (Unit and Feature tests) via PHPUnit, with coverage gate
      # Baseline measured at 52.6% lines (2026-08-02); floor set 2 points
      # under it. Ratchet upward deliberately as coverage-focused PRs land;
      # never lower it silently.
      # History: 37.15% (2026-07-17, floor 35), 49.6% (2026-08-01, floor 47).
      run: php artisan test --coverage --min=50
